# Hourly trigger for the daily streak reminders. Vercel Hobby cron only runs once a day, so GitHub Actions calls
# /api/cron-remind every hour (at :05); the function sends each reminder in the hour after its local time.
# Production only. Until the feature is merged to main the endpoint is 404, and until the Supabase/VAPID env vars
# are set it answers 503: both are logged as warnings and the job still passes. A wrong secret (401) or any other
# error (500, 502, ...) fails the job so it gets noticed.
# Run it by hand with: gh workflow run remind.yml
name: Streak reminders

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron-remind
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET secret is not set"; exit 0; fi
          # On a network failure curl already prints 000; "|| true" avoids appending a second one.
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" https://blop-nu.vercel.app/api/cron-remind || true)
          code=${code:-000}
          echo "HTTP $code"
          head -c 500 body.json 2>/dev/null; echo
          case "$code" in
            200) ;;
            404) echo "::warning::/api/cron-remind not deployed to production yet (merge to main)";;
            503) echo "::warning::Reminders aren't configured in production yet (Supabase, VAPID or CRON_SECRET env vars)";;
            000) echo "::warning::Couldn't reach blop"; exit 0;;
            *) echo "::error::cron-remind returned $code"; exit 1;;
          esac
